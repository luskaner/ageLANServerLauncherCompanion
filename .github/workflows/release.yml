name: Release

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - uses: lukka/run-vcpkg@v10

    - uses: microsoft/setup-msbuild@v2

    - name: Build Release
      run: msbuild /m /p:Configuration=Release

    - name: Build Debug
      run: msbuild /m /p:Configuration=Debug

    - uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.PASSPHRASE }}

    - name: Package DLL files
      shell: pwsh
      run: |
        $repo = "${{ github.event.repository.name }}"
        $tag = "${{ github.ref_name }}"
        $configs = @(
          @{ Variant = 'release'; Folder = 'x64/Release' },
          @{ Variant = 'debug';   Folder = 'x64/Debug' }
        )
        foreach ($c in $configs) {
          $folder = $c.Folder

          foreach ($file in (Get-ChildItem -Path $folder -Filter *.dll)) {
            $fileVersion = (Get-Item $file.FullName).VersionInfo.FileVersion
            $newName = "${repo}_$($file.BaseName)_$($c.Variant)_$fileVersion.dll"
            Rename-Item -Path $file.FullName -NewName $newName
          }

          foreach ($file in (Get-ChildItem -Path $folder -Filter *.dll)) {
            Compress-Archive -Path $file.FullName -DestinationPath "$folder\$($file.BaseName).zip"
          }

          Compress-Archive -Path "$folder\*.dll" -DestinationPath "$folder\${repo}_full_$($c.Variant)_$tag.zip"

          $hashes = @()
          foreach ($file in (Get-ChildItem -Path $folder -Filter *.zip)) {
            $hash = Get-FileHash -Path $file.FullName -Algorithm SHA256
            $hashes += "$($hash.Hash) $($file.Name)"
          }
          $sumsFile = "$folder\${repo}_checksums_$($c.Variant)_$tag.txt"
          $hashes | Out-File -FilePath $sumsFile
          gpg --output "$sumsFile.sig" --detach-sign $sumsFile
        }

    - uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          x64/Release/*.zip
          x64/Release/*_checksums_*.txt
          x64/Release/*_checksums_*.sig
          x64/Debug/*.zip
          x64/Debug/*_checksums_*.txt
          x64/Debug/*_checksums_*.sig
        draft: true
        generate_release_notes: true